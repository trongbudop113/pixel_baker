[project]
name = "pixel-bakery-backend"
version = "0.1.0"
description = "FastAPI + MongoDB backend for Pixel Bakery"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.116.0,<1.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0",
  "motor>=3.7.0,<4.0.0",
  "pydantic-settings>=2.10.0,<3.0.0",
  "python-jose[cryptography]>=3.5.0,<4.0.0",
  "passlib[bcrypt]>=1.7.4,<2.0.0",
  "email-validator>=2.2.0,<3.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
