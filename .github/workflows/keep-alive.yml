name: Keep Backend Alive

on:
  schedule:
    # Ping every 10 minutes (Render free tier sleeps after 15 min)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 60 \
            --connect-timeout 10 \
            https://pixel-bakery-api.onrender.com/api/v1/health) || STATUS="timeout"
          echo "Status: $STATUS"
          echo "Keep-alive ping done — backend woken up"
