name: Keep Backend Alive

on:
  schedule:
    # Ping every 10 minutes (Render free tier sleeps after 15 min)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            https://pixel-bakery-api.onrender.com/api/v1/health)
          echo "Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Warning: Backend returned $STATUS"
          fi
